<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Central Network — สรุปการอัปโหลดจอ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📊%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f5f9; --surface:#ffffff; --ink:#1b2331; --muted:#647084; --line:#e1e6ee;
  --head:#3c85d8; --head-ink:#ffffff; --band:#d9eafa; --divider:#d9d9d9; --divider-ink:#212121;
  --early:#3c85d8; --mid:#1f9a8a;
  --bad:#c62828; --bad-bg:#fdebea; --ok:#1b7f4b; --ok-bg:#e4f4ec; --focus:#1d5fb8;
  --font:"Noto Sans Thai","Leelawadee UI","Tahoma","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161e; --surface:#19202b; --ink:#e7ebf2; --muted:#98a3b5; --line:#2a3342;
    --head:#2c5f9e; --band:#1f2c3f; --divider:#3a414d; --divider-ink:#e7ebf2;
    --early:#5b9de6; --mid:#3cbfae;
    --bad:#ff8f86; --bad-bg:#3a2223; --ok:#62d29f; --ok-bg:#183428; --focus:#8bb8f2;
  }
}
:root[data-theme="dark"]{
  --bg:#11161e; --surface:#19202b; --ink:#e7ebf2; --muted:#98a3b5; --line:#2a3342;
  --head:#2c5f9e; --band:#1f2c3f; --divider:#3a414d; --divider-ink:#e7ebf2;
  --early:#5b9de6; --mid:#3cbfae;
  --bad:#ff8f86; --bad-bg:#3a2223; --ok:#62d29f; --ok-bg:#183428; --focus:#8bb8f2;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.top{max-width:1280px;margin:0 auto;padding:20px 20px 0}
.top h1{margin:0;font-size:22px;font-weight:700;letter-spacing:0}
.top p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.sample{margin:12px 0 0;padding:8px 12px;border-radius:8px;background:var(--bad-bg);color:var(--bad);font-size:13.5px}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:14px;border-bottom:1px solid var(--line)}
.tabs-in{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;padding:11px 16px 9px;cursor:pointer;
  color:var(--muted);font-weight:500;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--head);font-weight:700}

main{max-width:1280px;margin:0 auto;padding:18px 20px 40px}

.filters{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:end;margin-bottom:16px}
.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.f select,.f input[type=search]{min-width:170px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.f .wide-in{min-width:240px}
.f.chk{flex-direction:row;align-items:center;gap:7px;padding-bottom:8px;color:var(--ink);cursor:pointer}
.f.chk input{width:17px;height:17px;accent-color:var(--head)}

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:18px}
.strip>div{padding:14px 18px;border-left:1px solid var(--line)}
.strip>div:first-child{border-left:0}
.strip .k{font-size:13px;color:var(--muted)}
.strip .v{font-size:26px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
.strip .s{font-size:12.5px;color:var(--muted)}
@media (max-width:640px){.strip>div{border-left:0;border-top:1px solid var(--line)}.strip>div:first-child{border-top:0}}

.sec{margin:26px 0 8px;font-size:17px;font-weight:700}
.note{margin:8px 0 0;font-size:12.5px;color:var(--muted)}

.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px;font-variant-numeric:tabular-nums}
th{background:var(--head);color:var(--head-ink);font-weight:600;padding:10px 12px;text-align:center;font-size:14px}
td{padding:8px 12px;text-align:center;vertical-align:middle;border-bottom:1px solid var(--line)}
td.l,th.l{text-align:left}
td:not(.lst){white-space:nowrap}
table.wide{min-width:1040px}
td.lst{text-align:left;white-space:pre-line;min-width:230px;line-height:1.5}
tr.alt td{background:var(--band)}
tr.grp td{background:var(--divider);color:var(--divider-ink);font-weight:700;padding:8px 12px}
tr:last-child td{border-bottom:0}
.muted{color:var(--muted)}
small{color:var(--muted);font-size:12px}
.pill{display:inline-block;min-width:30px;padding:1px 9px;border-radius:99px;font-weight:600;font-size:13.5px}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.tag{display:inline-block;margin-left:8px;padding:0 8px;border-radius:99px;background:var(--surface);color:var(--muted);font-weight:500;font-size:12px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}

.bars{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 18px}
.bar-month{padding:12px 0;border-top:1px solid var(--line)}
.bar-month:first-child{border-top:0}
.bar-month h3{margin:0 0 8px;font-size:14.5px;font-weight:700}
.bar-row{display:grid;grid-template-columns:150px 1fr 190px;gap:12px;align-items:center;padding:5px 0}
.bar-row .lab{font-size:13.5px}
.track{height:26px;background:var(--bg);border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px 0 0 6px;min-width:2px}
.fill.p1{background:var(--early)} .fill.p2{background:var(--mid)}
.bar-row .val{font-size:13.5px;font-variant-numeric:tabular-nums}
.bar-row .val b{font-size:15px}
.bar-row .val small{display:block}
.up{color:var(--ok)} .down{color:var(--bad)}
@media (max-width:720px){.bar-row{grid-template-columns:1fr;gap:4px}}

.heat{font-variant-numeric:tabular-nums}
.cov{display:flex;align-items:center;gap:8px;justify-content:center}
.cov .track{width:96px;height:10px}
.cov .fill{border-radius:5px}
.tag.every{background:#d32f2f;color:#fff;font-weight:600}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin:0 0 8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
</style>
</head>

</header>

</div></nav>

  const strip='<div class="strip">'+
    '<div><div class="k">ครั้งที่อัปโหลด</div><div class="v">'+fmt(rows.length)+'</div><div class="s">จาก '+new Set(rows.map(r=>r.branch)).size+' สาขา</div></div>'+
    '<div><div class="k">ไฟล์รูปทั้งหมด</div><div class="v">'+fmt(files)+'</div><div class="s">เฉลี่ย '+fmt(Math.round(files/rows.length))+' ไฟล์ต่อครั้ง</div></div>'+
    '<div><div class="k">ครบทุกจอ</div><div class="v">'+complete+' / '+withMaster.length+'</div><div class="s">นับเฉพาะสาขาที่มีรายชื่อจอมาตรฐาน</div></div>'+
    '<div><div class="k">บันทึกล่าสุด</div><div class="v" style="font-size:18px;padding-top:6px">'+esc(latest)+'</div></div>'+
  '</div>';
  const head='<tr><th>วันที่</th><th class="l">สาขา</th><th>ไฟล์รูปทั้งหมด</th><th>วิดิโอ</th><th>จำนวนจอห้าง</th><th>จอที่พบไฟล์</th><th>จอที่ขาด</th><th>จอที่ไม่มีรูป</th><th>จอที่ไม่ระบุ</th><th>เวลาบันทึก</th></tr>';
  const body=groupedBody(rows,10,r=>{
    const has=r.expected!=null;
    const dash='<td title="'+NO_MASTER+'"><span class="muted">–</span></td>';
    return '<td>'+esc(r.date)+'</td><td class="l">'+esc(r.branch)+'</td><td>'+fmt(r.total)+'</td><td>'+fmt(r.video)+'</td><td>'+fmt(r.expected)+'</td>'+
      (has?'<td>'+fmt(r.found)+'</td><td>'+countPill(r.missing,true)+'</td><td>'+fmt(r.nophoto)+'</td><td>'+countPill(r.unidentified,true)+'</td>':dash+dash+dash+dash)+
      '<td><small>'+esc(r.ts)+'</small></td>';
  });
  return strip+'<div class="wrap"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'+
    '<p class="note">จอที่พบ / ขาด / ไม่มีรูป เทียบกับรายชื่อจอมาตรฐาน จึงมีเฉพาะสาขาที่มีรายชื่อนั้น สาขาอื่นแสดง –</p>';
}

/* ---------- หน้า 2 ---------- */
function page2(){
  let rows=applyBase(D);
  if(st.onlyMissing) rows=rows.filter(r=>(r.missing||0)>0);
  const q=st.q.trim().toLowerCase();
  if(q) rows=rows.filter(r=>[r.date,r.branch,r.found_list,r.missing_list,r.nophoto_list].join(' ').toLowerCase().includes(q));
  rows=sortRows(rows);
  if(!rows.length) return '<div class="wrap"><div class="empty">ไม่มีข้อมูลตามตัวกรองนี้</div></div>';
  const head='<tr><th>วันที่</th><th>สาขา</th><th>จำนวนจอที่พบ</th><th class="l">รายชื่อจอที่พบไฟล์</th><th>จำนวนจอที่ขาด</th><th class="l">รายชื่อจอที่ขาด</th><th>จอไม่มีรูป</th><th class="l">รายชื่อจอไม่มีรูป</th><th>จอไม่ระบุ</th><th class="l">รายชื่อจอที่ไม่ระบุ</th><th>วิดิโอ</th><th class="l">รายชื่อวิดิโอที่พบไฟล์</th></tr>';
  const body=groupedBody(rows,12,r=>{
    const ph=/^\(/.test(r.found_list||'');
    const vid='<td>'+fmt(r.video)+'</td><td class="lst">'+esc(r.video_list)+'</td>';
    return '<td>'+esc(r.date)+'</td><td>'+esc(r.branch)+'</td>'+
      (ph?'<td>'+fmt(r.found)+' <small>ไฟล์</small></td><td class="lst muted">'+esc(r.found_list)+'</td><td><span class="muted">–</span></td><td class="lst"></td><td><span class="muted">–</span></td><td class="lst"></td><td><span class="muted">–</span></td><td class="lst"></td>'
         :'<td>'+fmt(r.found)+'</td><td class="lst">'+esc(r.found_list)+'</td><td>'+countPill(r.missing,true)+'</td><td class="lst">'+esc(r.missing_list)+'</td><td>'+fmt(r.nophoto)+'</td><td class="lst">'+esc(r.nophoto_list)+'</td><td>'+countPill(r.unidentified,true)+'</td><td class="lst">'+esc(r.unidentified_list)+'</td>')+vid;
  });
  return '<div class="wrap"><table class="wide"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'+
    '<p class="note">รายชื่อจอจัดกลุ่มตามชั้น สาขาที่ยังไม่มีรายชื่อจอมาตรฐานแสดงเป็นจำนวนไฟล์รวมแทน</p>';
}

/* ---------- หน้า 3 ---------- */
function page3(){
  const rowsS=S.filter(r=>st.branch==='all'||r.branch===st.branch);
  const map=new Map();
  rowsS.forEach(r=>{
    let g=map.get(r.p.key); if(!g){g={p:r.p,files:0,uploads:0,br:new Set()};map.set(r.p.key,g);}
    g.files+=r.total||0; g.uploads++; g.br.add(r.branch);
  });
  const groups=[...map.values()].sort((a,b)=>a.p.sortKey-b.p.sortKey);
  if(!groups.length) return '<div class="wrap"><div class="empty">ไม่มีข้อมูลตามตัวกรองนี้</div></div>';

  const done=groups.filter(g=>!inProgress(g.p));
  const maxG=groups.reduce((a,g)=>g.files>a.files?g:a,groups[0]);
  const minG=done.length?done.reduce((a,g)=>g.files<a.files?g:a,done[0]):null;
  const avg=done.length?Math.round(done.reduce((a,g)=>a+g.files,0)/done.length):null;
  const strip='<div class="strip">'+
    '<div><div class="k">รอบที่ไฟล์มากที่สุด</div><div class="v">'+fmt(maxG.files)+'</div><div class="s">'+esc(maxG.p.month+' '+maxG.p.label)+'</div></div>'+
    '<div><div class="k">รอบที่ไฟล์น้อยที่สุด</div><div class="v">'+(minG?fmt(minG.files):'–')+'</div><div class="s">'+(minG?esc(minG.p.month+' '+minG.p.label):'ยังไม่มีรอบที่จบแล้ว')+'</div></div>'+
    '<div><div class="k">เฉลี่ยต่อรอบ</div><div class="v">'+fmt(avg)+'</div><div class="s">'+(done.length?'จาก '+done.length+' รอบที่จบแล้ว':'ยังไม่มีรอบที่จบแล้ว')+'</div></div>'+
  '</div>';

  const maxFiles=Math.max.apply(null,groups.map(g=>g.files))||1;
  const byMonth=new Map();
  groups.forEach((g,i)=>{const k=g.p.month;if(!byMonth.has(k))byMonth.set(k,[]);byMonth.get(k).push({g:g,i:i});});
  let bars='';
  byMonth.forEach((items,month)=>{
    bars+='<div class="bar-month"><h3>'+esc(month)+'</h3>';
    items.forEach(it=>{
      const g=it.g,prev=it.i>0?groups[it.i-1]:null;
      let delta='';
      if(prev&&prev.files>0&&!inProgress(g.p)){
        const d=(g.files-prev.files)/prev.files*100;
        delta='<small class="'+(d>=0?'up':'down')+'">'+(d>=0?'มากกว่า ':'น้อยกว่า ')+Math.abs(Math.round(d))+'% จากรอบก่อน</small>';
      }
      bars+='<div class="bar-row"><div class="lab">'+esc(g.p.label)+(inProgress(g.p)?'<span class="tag">กำลังดำเนินการ</span>':'')+'</div>'+
        '<div class="track" role="img" aria-label="'+esc(g.p.label)+' '+g.files+' ไฟล์"><div class="fill p'+g.p.per+'" style="width:'+(g.files/maxFiles*100)+'%"></div></div>'+
        '<div class="val"><b>'+fmt(g.files)+'</b> ไฟล์<small>'+g.uploads+' ครั้ง จาก '+g.br.size+' สาขา</small>'+delta+'</div></div>';
    });
    bars+='</div>';
  });

  /* ตารางสาขา x รอบ */
  const brSet=[...new Set(rowsS.map(r=>r.branch))].sort((a,b)=>a.localeCompare(b));
  const cell={}; let maxCell=1;
  rowsS.forEach(r=>{const k=r.branch+'|'+r.p.key;cell[k]=(cell[k]||0)+(r.total||0);if(cell[k]>maxCell)maxCell=cell[k];});
  let matrix='<tr><th class="l">สาขา</th>'+groups.map(g=>'<th>'+esc(g.p.month)+'<br><small style="color:inherit;opacity:.85">'+esc(g.p.label)+'</small></th>').join('')+'<th>รวม</th></tr>';
  brSet.forEach((b,i)=>{
    let total=0;
    const tds=groups.map(g=>{
      const v=cell[b+'|'+g.p.key]; if(v==null) return '<td><span class="muted">–</span></td>';
      total+=v; return '<td class="heat" style="background:color-mix(in srgb,var(--early) '+Math.round(v/maxCell*38)+'%,transparent)">'+fmt(v)+'</td>';
    }).join('');
    matrix+='<tr><td class="l">'+esc(b)+'</td>'+tds+'<td><b>'+fmt(total)+'</b></td></tr>';
  });

  /* ความครบของจอตามรอบ (จากแท็บสรุปตามรอบแต่ละเดือน) */
  const pr=P.filter(r=>st.branch==='all'||r.branch===st.branch).sort((a,b)=>a.p.sortKey-b.p.sortKey||a.branch.localeCompare(b.branch));
  let cov='';
  if(pr.length){
    const head='<tr><th class="l">สาขา</th><th>จำนวนจอห้าง</th><th>พบไฟล์</th><th>ขาด</th><th>ความครบ</th><th class="l">รายชื่อจอที่ขาด</th><th>ไม่ระบุ</th><th class="l">รายชื่อจอที่ไม่ระบุ</th><th>วิดิโอ</th></tr>';
    const body=groupedBody(pr,9,r=>{
      const vid='<td>'+fmt(r.video)+'</td>';
      if(r.expected==null) return '<td class="l">'+esc(r.branch)+'</td><td colspan="4" class="muted">'+NO_MASTER+' — รวม '+fmt(r.found)+' ไฟล์</td><td></td><td></td><td class="lst"></td>'+vid;
      const pct=r.expected?Math.round((r.found||0)/r.expected*100):0;
      const cls=pct>=90?'p2':(pct>=50?'p1':'');
      const color=pct>=90?'var(--ok)':(pct>=50?'var(--early)':'var(--bad)');
      return '<td class="l">'+esc(r.branch)+'</td><td>'+fmt(r.expected)+'</td><td>'+fmt(r.found)+'</td><td>'+countPill(r.missing,true)+'</td>'+
        '<td><div class="cov"><div class="track"><div class="fill" style="width:'+pct+'%;background:'+color+'"></div></div>'+pct+'%</div></td>'+
        '<td class="lst">'+esc(r.missing_list)+'</td><td>'+countPill(r.unidentified,true)+'</td><td class="lst">'+esc(r.unidentified_list)+'</td>'+vid;
    });
    cov='<h2 class="sec">ความครบของจอในแต่ละรอบ</h2><div class="wrap"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'+
      '<p class="note">นับสะสมตลอดรอบ: จอที่มีไฟล์ในการอัปโหลดครั้งใดครั้งหนึ่งของรอบ ถือว่าพบแล้ว</p>';
  }

  return strip+
    '<h2 class="sec" style="margin-top:0">ปริมาณไฟล์รูปในแต่ละรอบ</h2>'+
    '<div class="legend"><span><i style="background:var(--early)"></i>รอบต้นเดือน (1-15)</span><span><i style="background:var(--mid)"></i>รอบกลางเดือน</span></div>'+
    '<div class="bars">'+bars+'</div>'+
    '<p class="note">นับไฟล์จากทุกครั้งที่อัปโหลด ถ้าสาขาส่งซ้ำในวันเดียวกัน ตัวเลขอาจสูงกว่าจำนวนงานถ่ายจริง</p>'+
    '<h2 class="sec">ไฟล์รูปแยกตามสาขาและรอบ</h2><div class="wrap"><table><thead>'+matrix.replace('</tr>','</tr></thead><tbody>').replace(/^<tr>/,'<tr>')+'</tbody></table></div>'+
    cov;
}

/* ---------- แสดงผล ---------- */
function lateTokens(txt){const s=new Set();String(txt||'').split('\n').forEach(l=>{const m=/^(ชั้น\s*[^:]+):\s*(.*)$/.exec(l.trim());if(m)m[2].split(',').forEach(c=>{c=c.trim();if(c)s.add(m[1].trim()+': '+c);});});return s;}
const EVERY='<span class="tag every">ช้าทุกรอบ</span>';
function page4(){
  const rows=P.filter(r=>!inProgress(r.p)&&(st.branch==='all'||r.branch===st.branch))
              .sort((a,b)=>b.p.sortKey-a.p.sortKey||a.branch.localeCompare(b.branch));
  const withMaster=rows.filter(r=>r.expected!=null);
  const late=withMaster.filter(r=>(r.missing||0)>0);
  if(!withMaster.length) return '<div class="wrap"><div class="empty">ยังไม่มีรอบที่ปิดแล้ว หรือสาขาที่เลือกยังไม่มีรายชื่อจอมาตรฐาน</div></div>';

  const byBranch=new Map();
  withMaster.forEach(r=>{
    let b=byBranch.get(r.branch); if(!b){b={total:0,lateRounds:0,lateScreens:0,sets:[]};byBranch.set(r.branch,b);}
    b.total++; if((r.missing||0)>0){ b.lateRounds++; b.lateScreens+=r.missing; b.sets.push(lateTokens(r.missing_list)); }
  });
  const ranked=[...byBranch.entries()].map(([b,v])=>Object.assign({branch:b,every:v.total>=2&&v.lateRounds===v.total},v))
    .filter(v=>v.lateRounds>0).sort((a,b)=>(b.lateRounds/b.total)-(a.lateRounds/a.total)||b.lateScreens-a.lateScreens);

  const everySet=new Set(ranked.filter(v=>v.every).map(v=>v.branch));
  const strip='<div class="strip">'+
    '<div><div class="k">รอบที่ปิดแล้ว (นับได้)</div><div class="v">'+new Set(withMaster.map(r=>r.p.key)).size+'</div></div>'+
    '<div><div class="k">ครั้งที่ส่งช้า</div><div class="v">'+fmt(late.length)+'</div><div class="s">จาก '+fmt(withMaster.length)+' ครั้งที่นับได้</div></div>'+
    '<div><div class="k">สาขาที่มีของส่งช้า</div><div class="v">'+ranked.length+'</div><div class="s">จาก '+byBranch.size+' สาขาที่มีรายชื่อจอมาตรฐาน</div></div>'+
  '</div>';

  let rank='';
  if(ranked.length){
    rank='<h2 class="sec" style="margin-top:0">อันดับสาขาที่ส่งช้าบ่อย</h2>'+
      '<div class="wrap"><table><thead><tr><th class="l">สาขา</th><th>ส่งช้ากี่รอบ</th><th>จากทั้งหมดกี่รอบ</th><th>รวมจอที่ส่งช้าสะสม</th><th class="l">จอที่ช้าซ้ำทุกรอบ</th></tr></thead><tbody>'+
      ranked.map((v,i)=>'<tr class="'+(i%2?'alt':'')+'"><td class="l">'+esc(v.branch)+(v.every?EVERY:'')+'</td><td><span class="pill bad">'+v.lateRounds+'</span></td><td>'+v.total+'</td><td>'+fmt(v.lateScreens)+'</td><td class="lst">'+esc(v.every?([...v.sets[0]].filter(t=>v.sets.every(x=>x.has(t))).join(', ')||'–'):'–')+'</td></tr>').join('')+
      '</tbody></table></div>';
  }

  const head='<tr><th class="l">สาขา</th><th>จำนวนจอที่ส่งช้า</th><th class="l">รายชื่อจอที่ส่งช้า</th></tr>';
  const body=groupedBody(late,3,r=>'<td class="l">'+esc(r.branch)+(everySet.has(r.branch)?EVERY:'')+'</td><td>'+countPill(r.missing,true)+'</td><td class="lst">'+esc(r.missing_list)+'</td>');
  const table=late.length
    ? '<h2 class="sec">รายชื่อจอที่ส่งช้า แยกตามรอบ</h2><div class="wrap"><table class="wide"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'
    : '<h2 class="sec">รายชื่อจอที่ส่งช้า แยกตามรอบ</h2><div class="wrap"><div class="empty">ไม่มีจอส่งช้าตามตัวกรองนี้ 🎉</div></div>';

  return strip+rank+table+
    '<p class="note">นับ "ส่งช้า" จากจอที่ยังค้างอยู่ตอนรอบปิดแล้ว (พ้นวันที่ 15 หรือวันสุดท้ายของเดือน) ถึงแม้ภายหลังจะมีรูปเข้ามาในรอบถัดไปก็ยังนับว่าช้าของรอบเดิมอยู่ดี — เฉพาะสาขาที่มีรายชื่อจอมาตรฐานแล้วเท่านั้นที่นับได้</p>';
}

const pages={p1:page1,p2:page2,p3:page3,p4:page4};
function renderResults(){ $('#res').innerHTML=pages[st.tab](); }
function renderTab(){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===st.tab)));
  view.innerHTML=filterBar()+'<div id="res"></div>';
  renderResults();
}
function setTab(t){ if(!pages[t]) t='p1'; st.tab=t; renderTab(); }

document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  setTab(b.dataset.tab);
  try{ history.replaceState(null,'','#'+b.dataset.tab); }catch(e){}
}));
view.addEventListener('input',e=>{
  const t=e.target; if(!t.dataset||!t.dataset.f) return;
  st[t.dataset.f]=t.type==='checkbox'?t.checked:t.value; renderResults();
});

$('#meta').textContent='ข้อมูลจาก Google Sheet — สร้างเมื่อ '+((DATA.meta&&DATA.meta.generated)||'–');
if(DATA.meta&&DATA.meta.sample) $('#sample').hidden=false;
setTab((location.hash||'').replace('#','')||'p1');
}
(async function(){
  const el=document.getElementById('sample');let data=null;
  if(CFG.SHEET_ID){
    try{data=await loadSheet();}
    catch(e){el.textContent='โหลดจาก Google Sheet ไม่ได้ ('+e.message+') — เช็คว่า Share เป็น "ทุกคนที่มีลิงก์ดูได้" และชื่อแท็บตรงกับ CFG ตอนนี้แสดงข้อมูลตัวอย่างแทน';el.hidden=false;}
  }else{el.textContent='ยังไม่ได้ใส่ SHEET_ID ในส่วน CFG ของไฟล์นี้ — ตอนนี้แสดงข้อมูลตัวอย่างเพื่อดูหน้าตา';el.hidden=false;}
  start(data||DEMO_DATA);
})();
</script>
